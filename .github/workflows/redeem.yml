name: PTG Auto Redeem VN (API-first + YouTube + OCR tự sửa)

on:
  workflow_dispatch: {}

concurrency:
  group: ptg-redeem-vn
  cancel-in-progress: false

permissions:
  contents: write
  actions:   write

jobs:
  redeem:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REFRESH_INTERVAL: "60"
      MAX_RUNTIME:      "20700"
      MIN_UPTIME:       "120"
      DELAY_MIN:        "15000"
      DELAY_MAX:        "30000"
      YT_COOLDOWN:      "60"
      YT_MAX_PROBE:     "5"
      USE_API:          "1"
      YT_VERBOSE:       "0"
      DRY_RUN:          "0"
      TEST_CODE:        ""
      # ----- OCR thumbnail: off | alert | auto -----
      # auto = MAC DINH: vong tu sua (sai 2106 -> nho ma sai + doi recipe -> thu ma khac,
      #        toi da OCR_MAX_TRIES lan; 2117 = ma dung het luot -> dung sua; het budget ->
      #        vong sau tiep). OCR be tac -> PING OCR_PING_USER de nhap tay.
      OCR_MODE:         "auto"
      OCR_MAX_IMAGES:   "3"
      OCR_MAX_TRIES:    "50"
      OCR_LOOP_BUDGET:  "180"
      OCR_ALERT_CAP:    "6"
      WORKFLOW_FILE:    "redeem.yml"
      DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
      GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
      INNERTUBE_KEY:    ${{ secrets.INNERTUBE_KEY }}
      YT_API_KEY:       ${{ secrets.YT_API_KEY }}
      OCR_PING_USER:    ${{ secrets.OCR_PING_USER }}   # tuy chon; trong -> dung ID mac dinh
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Tesseract = bo may OCR. continue-on-error: OCR best-effort, thieu no thi tang OCR
      # tra rong, bot VAN chay (khong do ca run).
      - name: Install tesseract OCR (best-effort)
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Cache camoufox data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: camoufox-${{ runner.os }}-
      - name: Install playwright firefox deps
        run: python -m playwright install-deps firefox || true
      - name: Fetch camoufox engine
        run: python -m camoufox fetch

      - name: Run loop (API redeem + YouTube + OCR tự sửa)
        id: run
        run: python src/main.py

      - name: Trigger next run (self-chain 24/7)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          gh workflow run "$WORKFLOW_FILE" --ref "${GITHUB_REF_NAME:-main}"
          echo ">> da self-trigger run tiep theo (ref=${GITHUB_REF_NAME:-main})"

      - name: Upload screenshots on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ github.run_number }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 3
