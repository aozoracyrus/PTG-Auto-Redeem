name: PTG Auto Redeem VN

on:
  workflow_dispatch: {}

concurrency:
  group: ptg-redeem-vn
  cancel-in-progress: false

permissions:
  contents: write
  actions:   write

jobs:
  redeem:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REFRESH_INTERVAL: "60"
      MAX_RUNTIME:      "20700"
      MIN_UPTIME:       "120"
      DELAY_MIN:        "15000"
      DELAY_MAX:        "30000"
      YT_COOLDOWN:      "60"
      YT_MAX_PROBE:     "5"
      USE_API:          "1"
      YT_VERBOSE:       "0"
      DRY_RUN:          "0"
      TEST_CODE:        ""
      OCR_MODE:         "auto"
      OCR_ENGINE:       "auto"
      OCR_MAX_IMAGES:   "3"
      OCR_MAX_TRIES:    "50"
      OCR_LOOP_BUDGET:  "180"
      OCR_ALERT_CAP:    "6"
      WORKFLOW_FILE:    "redeem.yml"
      DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
      GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
      INNERTUBE_KEY:    ${{ secrets.INNERTUBE_KEY }}
      YT_API_KEY:       ${{ secrets.YT_API_KEY }}
      OCR_PING_USER:    ${{ secrets.OCR_PING_USER }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install torch CPU
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache EasyOCR
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-en-v1

      - name: Install tesseract (fallback)
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Cache camoufox
        uses: actions/cache@v4
        with:
          path: ~/.local/share/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: camoufox-${{ runner.os }}-

      - name: Install playwright deps
        run: python -m playwright install-deps firefox || true

      - name: Fetch camoufox
        run: python -m camoufox fetch

      - name: Run loop
        id: run
        run: python src/main.py

      - name: Trigger next run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          gh workflow run "$WORKFLOW_FILE" --ref "${GITHUB_REF_NAME:-main}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ github.run_number }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 3
