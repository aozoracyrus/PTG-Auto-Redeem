name: PTG Auto Redeem VN (API-first + YouTube + Community Posts + OCR chuỗi Gemini/EasyOCR)

on:
  workflow_dispatch: {}

concurrency:
  group: ptg-redeem-vn
  cancel-in-progress: false

permissions:
  contents: write
  actions:   write

jobs:
  redeem:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REFRESH_INTERVAL: "60"
      MAX_RUNTIME:      "20700"
      MIN_UPTIME:       "120"
      DELAY_MIN:        "15000"
      DELAY_MAX:        "30000"
      YT_COOLDOWN:      "60"
      YT_MAX_PROBE:     "5"
      USE_API:          "1"
      YT_VERBOSE:       "0"
      DRY_RUN:          "0"
      TEST_CODE:        ""

      # ===== DEADLINE (sửa bug "chạy 6h rồi tự ngắt") =====
      # JOB_START_EPOCH ghi ở step ĐẦU TIÊN -> main.py tính deadline trừ hao phút cài đặt.
      JOB_TIMEOUT_MINUTES:  "360"   # phải khớp timeout-minutes ở trên
      SHUTDOWN_RESERVE_SEC: "180"   # dự phòng commit + push + exit
      LOOP_RESERVE_SEC:     "90"    # ngưỡng dừng nhận việc mới
      TASK_RESERVE_SEC:     "45"    # ngưỡng dừng giữa các ID
      MIN_CHAIN_SEC:        "600"   # run ngắn hơn 10' = crash lặp -> KHÔNG nối chuỗi

      OCR_MODE:         "auto"
      OCR_ENGINE:       "auto"
      LOCAL_WHEN:       "fallback-only"

      GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL_CHAIN: "gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash-lite"
      GEMINI_MODEL:     ${{ secrets.GEMINI_MODEL }}
      GEMINI_TIMEOUT:   "45"
      GEMINI_MAX_CALLS: "8"
      GEMINI_BUSY_BACKOFF_SEC: "300"
      GEMINI_THROTTLE_SEC: "2.5"

      OCR_MAX_IMAGES:   "3"
      OCR_MAX_TRIES:    "50"
      OCR_LOOP_BUDGET:  "180"
      OCR_ALERT_CAP:    "6"

      YT_VIDEO_SCAN:    "3"
      BARE_ORDER:       "newest-first"
      OCR_USE_OEMBED:   "1"

      YT_POSTS:         "1"
      YT_POSTS_MAX:     "5"
      INNERTUBE_PARAMS_POSTS: "EgVwb3N0c_IGBAoCSgA=,EgVwb3N0c_IGBAoCSgA%3D"
      YT_POSTS_COOKIE:  ${{ secrets.YT_POSTS_COOKIE }}

      WORKFLOW_FILE:    "redeem.yml"
      DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
      GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
      INNERTUBE_KEY:    ${{ secrets.INNERTUBE_KEY }}
      YT_API_KEY:       ${{ secrets.YT_API_KEY }}
      OCR_PING_USER:    ${{ secrets.OCR_PING_USER }}
    steps:
      # STEP ĐẦU TIÊN: ghi mốc bắt đầu job (tính cả phút cài đặt vào ngân sách thời gian).
      - name: Ghi mốc bắt đầu job
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with: { persist-credentials: true }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install torch (CPU only, cho fallback)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache EasyOCR models (fallback)
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-en-v1
          restore-keys: easyocr-

      - name: Install tesseract (fallback, best-effort)
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Cache camoufox data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: camoufox-${{ runner.os }}-
      - name: Install playwright firefox deps
        run: python -m playwright install-deps firefox || true
      - name: Fetch camoufox engine
        run: python -m camoufox fetch

      - name: Run loop (API redeem + YouTube + Posts + OCR chuỗi Gemini/EasyOCR)
        id: run
        run: python src/main.py

      # SỬA BUG CHUỖI ĐỨT: trước đây `if: success()` -> job fail/timeout là KHÔNG spawn run kế.
      # Nay: !cancelled() = chạy cả khi success LẪN failure; chỉ bỏ qua khi bạn Cancel tay.
      # chain='0' do main.py ghi khi crash sớm (< MIN_CHAIN_SEC) -> dừng chuỗi có chủ đích.
      # Nếu job bị giết giữa chừng (không ghi được output) -> chain rỗng != '0' -> VẪN nối chuỗi.
      - name: Trigger next run (self-chain 24/7, kể cả lỗi tạm thời)
        if: ${{ !cancelled() && steps.run.outputs.chain != '0' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          gh workflow run "$WORKFLOW_FILE" --ref "${GITHUB_REF_NAME:-main}"
          echo ">> đã self-trigger run kế tiếp (ref=${GITHUB_REF_NAME:-main}, chain='${{ steps.run.outputs.chain }}')"

      - name: Upload screenshots on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ github.run_number }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 3
